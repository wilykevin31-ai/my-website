<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>阿郎鹹酥雞 點餐</title>

<style>
body{
  font-family:"Microsoft JhengHei",sans-serif;
  margin:0;
  padding:10px;
  background:#f2f2f2;
}
h1{text-align:center;margin:10px 0;}

.category{
  margin:16px 0;
  padding:14px;

}

.side{background:#e3f2fd;}

.category-title{
  font-size:20px;

  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));

}

.item{
  background:#fff;
  border-radius:12px;

}

.price{color:#e53935;font-size:14px;margin-top:2px;}

.ctrl button{
  width:32px;

  border:none;
  border-radius:50%;
  font-size:18px;
  background:#ffd180;
  cursor:pointer;
}
.qty{min-width:20px;}

#panel{
  background:#fff;
  margin-top:20px;
  padding:14px;
  border-radius:16px;
}
textarea{
  width:100%;
  height:70px;
  resize:none;
}
.total{
  text-align:right;
  font-size:18px;
  margin-top:6px;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}
button.main{
  flex:1;
  padding:10px;
  font-size:16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.copy{background:#4caf50;color:#fff;}
.clear{background:#f44336;color:#fff;}
</style>
</head>

<body>
<h1>阿郎鹹酥雞 🍗</h1>

<div id="menu"></div>

<div id="panel">
  <textarea id="output" placeholder="尚未點餐" readonly></textarea>
  <div class="total">總金額：<span id="total">$0</span></div>
  <div class="actions">
    <button class="main copy" onclick="copyOrder()">複製點餐</button>
    <button class="main clear" onclick="clearOrder()">清空</button>
  </div>
</div>

<script>
const categories = [

{
  name:'🍗 肉類 / 海鮮',
  class:'meat',
  items:[

    ['香酥雞排',85],
    ['黃金魚條(份)',70],
    ['炸雞排(份)',70],
    ['深海魷魚(份)',70],

    ['雞軟骨(份)',60],
    ['無骨鹹酥雞(份)',60],
    ['脆皮雞排(份)',50],

    ['花枝丸(串)',25],
    ['九層塔花枝丸(串)',25],
    ['鱈魚條(串)',25],
    ['鱈魚脆丸(串)',25],
    ['黃金魚丸(串)',25],

    ['雞屁股(串)',25],
    ['雞胗(串)',25],
    ['雞心(串)',25],

    ['雞脖(串)',20],
    ['寶丸(串)',20],
    ['龍鳳腿(支)',20],

    ['蝦球(串)',30],
    ['蝦捲(條)',30],

    ['脆皮(份)',25],
    ['柳葉魚(2條)',25]
  ]
},

{
  name:'🥓 加工 / 配料',
  class:'side',
  items:[

    ['小肉豆(份)',30],
    ['手工黑輪片',30],
    ['一口吃香腸(串)',30],

    ['脆皮糯米腸(條)',25],
    ['百頁豆腐(條)',25],
    ['蘿蔔糕(條)',25],
    ['芋粿巧(條)',25],
    ['魚板(條)',25],
    ['青椒條(條)',25],

    ['小香腸(2條)',25],

    ['芋簽(份)',20],
    ['糯米腸(條)',20],
    ['小熱狗(3條)',20],
    ['竹輪(條)',20],

    ['米血糕(條)',15],
    ['豆干(3塊)',15],

    ['炸湯圓(份)',25],
    ['銀絲卷(份)',25],
    ['黑糖麻花捲(條)',25],

    ['麥克雞塊(份)',35],
    ['脆薯(份)',30],
    ['洋蔥圈(份)',30],
    ['炸薯餅乾(份)',30],
    ['香草馬鈴薯丸(份)',30],

    ['蝦捲(條)',30],

    ['芋泥地瓜球(份)',30],
    ['玉米布丁酥(份)',30],

    ['起司條(2條)',25],
    ['肉鬆芋條(3條)',25],

    ['熱狗棒(甜、普)',25],

    ['芋頭籤條(份)',20],
    ['芋圓餅(3顆)',20],

    ['薯餅(塊)',15]
  ]
},

{
  name:'🥬 蔬菜 / 豆腐',
  class:'veg',
  items:[

    ['韓國豆腐(塊)',55],

    ['玉米筍',40],

    ['杏鮑菇',35],
    ['香菇',35],
    ['花椰菜',35],
    ['四季豆',35],

    ['青椒',25],
    ['小黃瓜',25]
  ]
}

];

const order = {};
const menu = document.getElementById('menu');
const output = document.getElementById('output');
const totalEl = document.getElementById('total');

categories.forEach(cat=>{
  const box=document.createElement('div');
  box.className=`category ${cat.class}`;
  box.innerHTML=`<div class="category-title">${cat.name}</div>`;
  const grid=document.createElement('div');
  grid.className='grid';

  cat.items.forEach(([n,p])=>{
    order[n]=0;
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`
      <div>${n}</div>
      <div class="price">$${p}</div>
      <div class="ctrl">
        <button onclick="chg('${n}',-1)">−</button>
        <span class="qty" id="q-${n}">0</span>
        <button onclick="chg('${n}',1)">+</button>
      </div>`;
    grid.appendChild(d);
  });

  box.appendChild(grid);
  menu.appendChild(box);
});

function chg(n,d){
  order[n]=Math.max(0,order[n]+d);
  render();
}

function render(){
  let total=0, list=[];
  categories.forEach(c=>c.items.forEach(([n,p])=>{
    document.getElementById(`q-${n}`).innerText=order[n];
    if(order[n]>0){
      total+=order[n]*p;
      list.push(`${n}x${order[n]}`);
    }
  }));
  output.value=list.join(' ');
  totalEl.innerText=`$${total}`;
}

async function copyOrder(){
  if(!output.value) return alert('尚未點餐');
  const text=`點餐：${output.value}\n總金額：${totalEl.innerText}`;
  try{
    await navigator.clipboard.writeText(text);
    alert('✅ 已複製');
  }catch{
    const t=document.createElement('textarea');
    t.value=text;document.body.appendChild(t);
    t.select();document.execCommand('copy');
    document.body.removeChild(t);
    alert('已複製');
  }
}

function clearOrder(){
  Object.keys(order).forEach(k=>order[k]=0);
  render();
}
</script>
</body>
</html>
